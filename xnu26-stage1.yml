# Stage 1 - toolchain smoke test for the iOS 26 (xnu-12377) port.
# Put this file in your own PUBLIC repo as .github/workflows/xnu26-stage1.yml
# (public repos get free macOS runner minutes).
#
# UNTESTED DRAFT: written from the beyond2lte-ios docs/scripts, never run on a runner.
# Goal of this stage is only to answer, with real logs:
#   1. does the macos-26 runner have Xcode 26.5 with the iphoneos 26.5 SDK?
#   2. can we download and install KDK 26.5 (25F71) from the Dortania mirror?
#   3. do the pinned xnu-12377 checkout and the B2L patches + overlay apply cleanly?
# The kernel build itself (stage 2) needs the dependency root (AvailabilityVersions,
# libfirehose_kernel) that beyond2lte built by hand, so it is not attempted here.

name: xnu26-stage1

on:
  workflow_dispatch:

env:
  KDK_TAG: "25F71"                       # Kernel Debug Kit 26.5 (matches B2L docs)
  XNU_SHA: ac9718fb1af618d5ce8678d0dc6e8a58f252216f   # rel/xnu-12377 pin used by B2L
  AVAILABILITY_SHA: 149b1777f3e8c2133042d8e188f72e3adf6a7110
  LIBDISPATCH_SHA: 701f4d1a24ae9c6863901bbbb22624b7d1b87321

jobs:
  smoke:
    runs-on: macos-26          # Apple Silicon image (Xcode 26.5 and 26.6 installed)
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26.5 and check SDKs
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          echo "iphoneos SDK:  $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "macosx SDK:    $(xcrun --sdk macosx --show-sdk-version)"
          xcrun --find iig || true
          uname -m

      - name: Download KDK from the Dortania mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kdk
          gh release view "$KDK_TAG" -R dortania/KdkSupportPkg --json assets \
            --jq '.assets[] | "\(.name)  \(.size)"'
          gh release download "$KDK_TAG" -R dortania/KdkSupportPkg -D kdk
          ls -la kdk

      - name: Install KDK
        run: |
          set -x
          cd kdk
          for f in *.dmg; do [ -e "$f" ] && hdiutil attach "$f" -nobrowse -mountpoint /tmp/kdkmnt; done
          find /tmp/kdkmnt -maxdepth 2 \( -name '*.pkg' -o -name '*.kdk' \) 2>/dev/null
          for p in $(find /tmp/kdkmnt -maxdepth 2 -name '*.pkg'); do
            sudo installer -pkg "$p" -target /
          done
          ls -la /Library/Developer/KDKs || true
          ls /Library/Developer/KDKs/*/System/Library/Kernels 2>/dev/null || true
          ls /Library/Developer/KDKs/*/System/Library/KernelSupport 2>/dev/null || true

      - name: Fetch pinned sources
        run: |
          git clone --depth 1 https://github.com/orhunnx/beyond2lte-ios b2l
          git -C b2l rev-parse HEAD | tee b2l.sha
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/xnu.git xnu
          git -C xnu fetch --depth 1 origin "$XNU_SHA"
          git -C xnu checkout --detach "$XNU_SHA"
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/AvailabilityVersions.git av
          git -C av fetch --depth 1 origin "$AVAILABILITY_SHA" && git -C av checkout --detach "$AVAILABILITY_SHA"
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/libdispatch.git ld
          git -C ld fetch --depth 1 origin "$LIBDISPATCH_SHA" && git -C ld checkout --detach "$LIBDISPATCH_SHA"

      - name: Apply B2L patches and overlay to pristine xnu-12377
        run: |
          bash b2l/scripts/prepare-xnu.sh "$PWD/xnu"
          git -C xnu status --short | head -50
          git -C xnu diff --stat | tail -5

      - name: Upload what we learned
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-info
          path: |
            b2l.sha
          retention-days: 7
